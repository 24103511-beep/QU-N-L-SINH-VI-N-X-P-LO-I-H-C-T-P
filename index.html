<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên & Xếp Loại Học Tập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Quản Lý Sinh Viên & Xếp Loại Học Tập</h2>
        
        <form id="studentForm">
            <div class="form-group">
                <label for="studentName">Họ và tên sinh viên:</label>
                <input type="text" id="studentName" placeholder="Nhập tên sinh viên...">
                <small class="error-message" id="nameError"></small>
            </div>

            <fieldset>
                <legend>Nhập điểm các môn học (Thang điểm 0 - 10)</legend>
                
                <div class="form-group">
                    <label for="score1">Giải tích 1:</label>
                    <input type="number" id="score1" step="0.1" min="0" max="10" placeholder="0 - 10">
                    <small class="error-message" id="score1Error"></small>
                </div>

                <div class="form-group">
                    <label for="score2">Đại số tuyến tính:</label>
                    <input type="number" id="score2" step="0.1" min="0" max="10" placeholder="0 - 10">
                    <small class="error-message" id="score2Error"></small>
                </div>

                <div class="form-group">
                    <label for="score3">Xác suất thống kê:</label>
                    <input type="number" id="score3" step="0.1" min="0" max="10" placeholder="0 - 10">
                    <small class="error-message" id="score3Error"></small>
                </div>

                <div class="form-group">
                    <label for="score4">Tin học đại cương:</label>
                    <input type="number" id="score4" step="0.1" min="0" max="10" placeholder="0 - 10">
                    <small class="error-message" id="score4Error"></small>
                </div>

                <div class="form-group">
                    <label for="score5">Xây dựng ứng dụng Web:</label>
                    <input type="number" id="score5" step="0.1" min="0" max="10" placeholder="0 - 10">
                    <small class="error-message" id="score5Error"></small>
                </div>
            </fieldset>

            <button type="button" onclick="processData()">Tính kết quả</button>
        </form>

        <div id="resultContainer" class="result-container hidden">
            <h3>Kết Quả Học Tập</h3>
            <p><strong>Sinh viên:</strong> <span id="resStudentName"></span></p>
            
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Tên môn học</th>
                        <th>Điểm số</th>
                    </tr>
                </thead>
                <tbody id="scoresTableBody">
                    <!-- Kết quả từng môn sẽ được chèn vào đây -->
                </tbody>
            </table>

            <div class="summary">
                <p><strong>Điểm trung bình:</strong> <span id="resAverage"></span></p>
                <p><strong>Xếp loại học tập:</strong> <span id="resClassification" class="badge"></span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
